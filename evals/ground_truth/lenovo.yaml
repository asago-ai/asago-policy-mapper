- id: mit-ai-risk-subdomain-7.4
  name: Lack of transparency or interpretability
  evidence:
  - text: We will strive to create and use AI systems that are explainable. Explainable
      AI uses processes and methods that allow users to understand, in a meaningful
      way, the facts and inferences behind an AI system's action.
    section: 3.1c Explainability
  - text: AI systems at Lenovo will be transparent. We will establish mechanisms to
      ensure transparency of the capabilities and limitations on AI systems to ensure
      users can make informed choices about them.
    section: 3.1d Transparency
