risks:
- id: ai-risk-taxonomy-adversely-affects-legal-rights
  name: Adversely affects legal rights
  evidence:
  - text: Agencies shall ensure that AI solutions have appropriate interventions and
      checks from humans, otherwise known as human in the loop (HITL) procedures,
      meaning there is active human participation in the decision-making process,
      review, oversight, and validation of AI systems including any generated content
      or output.
    section: 5.1.1 Decision Making
  - text: 'AI solutions that are used to formulate high-risk decisions regarding the
      topics listed below will be subject to audits: ... Benefits eligibility and
      determinations ... Life-changing ... Health, safety, and welfare of citizens
      or Commonwealth employees.'
    section: 5.1.4 Retention
  - text: Decisions made by AI that have legal, financial, human resource, legislative,
      organizational, or regulatory impact must include a human verification process.
    section: 5.1.6 Governance
- id: ai-risk-taxonomy-discrimination-in-employment,-benefits,-or-services
  name: Discrimination in employment, benefits, or services
  evidence:
  - text: AI solutions may exhibit algorithmic bias, which may result in algorithmic
      discrimination, which are instances when automated systems contribute to unjustified
      treatment or disfavoring of people or communities based on protected legal classifications.
    section: 5.1.2 Data Sets
  - text: Reinforcing existing bias in work products due to bias in generative AI
      outputs.
    section: 5.2.2 Risk Assessment
  - text: 'Bias: Since the data used to train generative AI is vast, from a variety
      of sources, and not always vetted, outputs may contain inaccurate assumptions
      or stereotypes regarding certain individuals or communities.'
    section: 5.2.3 Accountability, Review, and Verification
  - text: Protocols and procedures for assessing and handling inquiries or accidental
      events regarding AI system anomalies with priority given for decisions that
      have potential implications for public safety or perceived workforce/labor discriminatory
      practices.
    section: 5.1.6 Governance
  - text: For example, do not use generative AI to make final decisions that affect
      employment.
    section: 5.2.6.3 Decision Making
- id: ai-risk-taxonomy-employment
  name: Employment
  evidence:
  - text: For example, do not use generative AI to make final decisions that affect
      employment.
    section: 5.2.6.3 Decision Making
  - text: For example, do not use generative AI to make final decisions that affect
      employment.
    section: 5.2.6.3 Decision Making
- id: ai-risk-taxonomy-generating-or-promoting-misinformation
  name: Generating or promoting misinformation
  evidence:
  - text: Inaccurate output can also be generated regardless of the training data.
      The generative AI system may produce a confident response that appears plausible;
      however, the response is fabricated and divorced from reality (sometimes referred
      to as 'hallucinations').
    section: 5.2.3 Accountability, Review, and Verification
  - text: 'Inaccurate Information: Generative AI relies on training data. Training
      data is vast and not always consistent or accurate. Inaccuracies in the training
      data may be included in the output generated by the generative AI system.'
    section: 5.2.3 Accountability, Review, and Verification
  - text: The generative AI system may produce a confident response that appears plausible;
      however, the response is fabricated and divorced from reality (sometimes referred
      to as 'hallucinations').
    section: 5.2.3 Accountability, Review, and Verification
- id: ai-risk-taxonomy-government-services
  name: Government services
  evidence:
  - text: Benefits eligibility and determinations, Life-changing, Health, safety,
      and welfare of citizens or Commonwealth employees.
    section: 5.1.4 Retention
- id: ai-risk-taxonomy-impersonating-humans
  name: Impersonating humans
  evidence:
  - text: When a customer is interacting with an AI solution on behalf of an agency,
      the solution shall disclose to the customer that they are interacting with an
      AI solution.
    section: 5.1.5 Disclosure
- id: ai-risk-taxonomy-ip-rights/-trade-secrets
  name: IP Rights/ Trade Secrets
  evidence:
  - text: 'Intellectual Property: Generative AI tools continually ingest publicly
      available information for training purposes including information that may be
      subject to copyright. Copyrighted information could be inappropriately included
      in any output generated by a generative AI system, creating intellectual property
      risks.'
    section: 5.2.3 Accountability, Review, and Verification
  - text: Copyrighted information could be inappropriately included in any output
      generated by the generative AI system, creating intellectual property risks.
    section: 5.2.3 Accountability, Review, and Verification
  - text: 'Note: It is important to understand the potential liabilities with intellectual
      property and data ownership associated with third party entities.'
    section: 5.1.6 Governance
- id: ai-risk-taxonomy-not-labeling-content-as-ai-generated
  name: Not labeling content as AI-generated (Using chatbots to convince people they
    are communicating with a human)
  evidence:
  - text: Users shall be transparent about their use of generative AI and must disclose
      to customers, residents, visitors, and industry when generative AI has been
      used to generate content that may be public facing or shared externally.
    section: 5.2.4 Disclosure
  - text: When a customer is interacting with an AI solution on behalf of an agency,
      the solution shall disclose to the customer that they are interacting with an
      AI solution.
    section: 5.1.5 Disclosure
  - text: When a customer is interacting with an AI solution on behalf of an agency,
