- id: atlas-data-curation
  name: Improper data curation
  evidence:
  - text: Institute proper data and information management controls, procedures, and
      processes for data set selection, evaluation, and preparation for use with AI
      solutions.
    section: 5.1.7 Data Management
  - text: Establish data validation procedures and processes to select, analyze, clean,
      and certify the quality and integrity of the data sources that will be used
      for AI automation solutions.
    section: 5.1.7 Data Management
  - text: Data sets should be reviewed to ensure quality and integrity of the data
      sets.
    section: 5.1.2 Data Sets
  - text: Institute processes and procedures for preprocessing and transforming the
      selected data set to format, clean, sample, decompose, and aggregate the data
      to ensure alignment with the model and the problem being solved.
    section: 5.1.7 Data Management
- id: atlas-data-poisoning
  name: Data poisoning
  evidence:
  - text: Establish controls to prevent adversarial learning to include attacks that
      try to influence the training data of spam filters or systems for abnormal network
      traffic detection, designed to mislead the learning algorithm for subsequent
      exploitation.
    section: 5.1.9 Security
