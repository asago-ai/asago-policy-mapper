- id: ai-risk-taxonomy-vulnerability-probing
  name: Vulnerability probing
  evidence:
  - text: AI systems vulnerability scanning methods and techniques need to be enhanced
      for the discovery and categorization of security vulnerabilities or other design
      flaws and appropriate mitigation or resolution requirements to address known
      vulnerabilities.
    section: 5.1.9 Security
  - text: AI systems vulnerability scanning methods and techniques need to be enhanced
      for the discovery and categorization of security vulnerabilities or other design
      flaws and appropriate mitigation or resolution requirements to address known
      vulnerabilities.
    section: 5.1.9 Security
  - text: Users must be cautious not to include production code or proprietary information
      in prompts, must assess vulnerabilities in code outputs, and must keep in mind
      that assessment of these outputs may require technical knowledge.
    section: 5.2.2 Generative AI & Coding
- id: atlas-confidential-data-in-prompt
  name: Confidential data in prompt
  evidence:
  - text: Users should not have any expectation of privacy when interacting with generative
      AI tools. Any data or information that users would not include in public facing
      documents or emails should never be entered into any generative AI tools.
    section: 5.2.5 Data Privacy
  - text: No class C data, as defined in the Data Classification Policy , may be input
