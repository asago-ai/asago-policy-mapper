- id: atlas-data-bias
  name: Data bias
  evidence:
  - text: The ICRC acknowledges the significant risks of AI systems that could generate
      false or inaccurate data and replicate or amplify systemic and societal discriminations,
      biases and stereotypes - in particular around gender and race. We make proactive
      and sustained efforts to understand, avoid and mitigate these risks through
      our choice and use of AI solutions, and by avoiding their use where these biases
      cannot be effectively avoided or mitigated.
    section: 5.1. A humanitarian and principled approach
