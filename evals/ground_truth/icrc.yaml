- id: mit-ai-risk-subdomain-5.2
  name: Loss of human agency and autonomy
  evidence:
  - text: Additional systematic data quality control and meaningful and effective
      human oversight mechanisms are put in place to control and review relevant training
      models, algorithmic systems, inputs and outputs throughout the lifecycle of
      AI solutions used to support operational activities and decision-making processes
      that have an impact and present a risk of harm for affected people and users.
    section: 6.2. Safety and security
  - text: Responsibility and accountability for decision-making supported by AI always
      lies with the ICRC and/or the staff using the tools or system concerned, in
      line with the ICRC's Code of Conduct and other applicable internal rules.
    section: 6.4. Responsibility and accountability
  - text: Responsibility and accountability for decision-making supported by AI always
      lies with the ICRC and/or the staff using the tools or system concerned, in
      line with the ICRC's Code of Conduct and other applicable internal rules.
    section: 6.4. Responsibility and accountability
- id: mit-ai-risk-subdomain-6.4
  name: Competitive dynamics
  evidence:
  - text: Externally, AI-related debates - on opportunities, risks and regulatory
      needs and options - have become politicized in the context of global strategic
      competition between states that disincentivizes controls and limits, market
      forces that incentivize risk-taking by private sector actors and vastly differing
      assessments of the relevance and impact AI will have for societies and people.
    section: 4. RATIONALE
  - text: AI-related debates - on opportunities, risks and regulatory needs and options
      - have become politicized in the context of global strategic competition between
      states that disincentivizes controls and limits, market forces that incentivize
      risk-taking by private sector actors
    section: 4. RATIONALE
  - text: AI is an object of increasing politicization and competition between states
      at the global level, as well as private-sector and non-state actors.
    section: 5.1. A humanitarian and principled approach
- id: mit-ai-risk-subdomain-6.5
  name: Governance failure
  evidence:
  - text: Yet, the ICRC currently lacks a common policy framework to ensure that these
      various activities are organized and managed by a clear, consistent, formal
      and professional methodology. This policy is intended to help bridge this gap
      and inform the ICRC's efforts to leverage technological innovation efficiently
      through effective governance mechanisms and a responsible approach that focuses
      on generating relevant and sustainable humanitarian impact and upholding the
      organization's principles and values.
    section: 4. RATIONALE
  - text: the ICRC currently lacks a common policy framework to ensure that these
      various activities are organized and managed by a clear, consistent, formal
      and professional methodology.
    section: 4. RATIONALE
- id: mit-ai-risk-subdomain-6.6
  name: Environmental harm
  evidence:
  - text: All possible efforts are made to integrate and mitigate the environmental
      impact and carbon footprint of considered AI solutions through a life-cycle
      approach. This includes favouring solutions and tools that have a lighter footprint,
      in line with the ICRC's Plan of Action under the Climate and Environment Charter
      for Humanitarian Organizations and the ICRC's Framework for Sustainable Development.
    section: 6.4. Responsibility and accountability
  - text: All possible efforts are made to integrate and mitigate the environmental
      impact and carbon footprint  of  considered  AI  solutions  through  a  life-cycle  approach.
    section: 6.4. Responsibility and accountability
  - text: All possible efforts are made to integrate and mitigate the environmental
      impact and carbon footprint of considered AI solutions through a life-cycle
      approach.
    section: 6.4. Responsibility and accountability
- id: mit-ai-risk-subdomain-7.3
  name: Lack of capability or robustness
  evidence:
  - text: Additional  systematic  data  quality  control  and  meaningful  and  effective  human  oversight
      mechanisms are put in place to control and review relevant training models,
      algorithmic systems, inputs and outputs throughout the lifecycle of AI solutions
      used to support operational activities and decision-making processes that have
      an impact and present a risk of harm for affected people and users.
    section: 6.2. Safety and security
  - text: When the potential benefits of AI outweigh identified risks, solutions under
      consideration are thoroughly tested before being rolled out. The necessary evidence
      is gathered through scientific experimentation and 'sandbox' testing to ensure,
      as far as possible, the effectiveness and safety of the solutions in context.
    section: 6.1. Proportionality, precaution, and 'do no harm'
  - text: When the potential benefits of AI outweigh identified risks, solutions under
      consideration are thoroughly tested before being rolled out. The necessary evidence
      is gathered through scientific experimentation and 'sandbox' testing to ensure,
      as far as possible, the effectiveness and safety of the solutions in context.
    section: 6.1. Proportionality, precaution, and 'do no harm'
- id: mit-ai-risk-subdomain-7.4
  name: Lack of transparency or interpretability
  evidence:
  - text: Transparency and 'explainability' are essential elements of a safe, ethical
      and responsible approach to AI, and to ensure respect for the ICRC's principles,
      rules and values. The ICRC therefore ensures at all times the highest possible
      levels of transparency in our use and management of AI solutions, in accordance
      with the context, risks and impact of the systems and tools considered, and
      with due consideration to the principles of safety, security and privacy.
    section: 6.3. Transparency and 'explainability'
  - text: This includes adequate and meaningful information about why, when and how
      AI solutions are used, and explanations on the causal link between AI inputs
      and outputs and the functioning of algorithmic processes.
    section: 6.3. Transparency and 'explainability'
