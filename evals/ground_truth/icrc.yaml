- id: atlas-data-privacy-rights
  name: Data privacy rights alignment
  evidence:
  - text: Systematic data protection impact assessments are carried out prior to the
      acquisition, deployment or use of considered AI solutions, and when relevant
      and feasible, solutions are put in place to restrict processing and enable rectification
      and/or erasure of the data used.
    section: 6.2. Safety and security
- id: atlas-data-usage
  name: Data Usage
  evidence:
  - text: The ICRC ensures that the use of internal and external AI solutions are
      aligned with the rules and the principles of lawfulness, fairness, transparency,
      purpose limitation, data minimization, accuracy, storage limitation, security
      and accountability.
    section: 6. GUIDING PRINCIPLES - Safety and security
