- id: ai-risk-taxonomy-employment
  name: Employment
  evidence:
  - text: 'High risk: these pose a significant threat to the health, safety, or fundamental
      rights of individuals or groups and are subject to strict requirements. This
      one is most relevant to employment and student recruitment, in particular in
      recruitment practices.'
    section: EU AI Act
  - text: Where the use of AI presents a high risk to individuals- for example, in
      employment decisions, human decision making should always be used appropriately.
    section: Bias and discrimination AI issues
  - text: This one is most relevant to employment and student recruitment, in particular
      in recruitment practices.
    section: EUAI Act
- id: ai-risk-taxonomy-generating-or-promoting-misinformation
  name: Generating or promoting misinformation
  evidence:
  - text: AI tools are known to hallucinate, namely supplying information that has
      no basis in reality, or else reproducing information that is out of date or
      is misinformation.
    section: Cybersecurity AI rules
  - text: AI tools are known to hallucinate, namely supplying information that has
      no basis in reality, or else reproducing information that is out of date or
      is misinformation.
    section: Cybersecurity AI rules
  - text: Do not trust any information supplied by AI tools without undertaking independent
      verification.
    section: Cybersecurity AI rules
- id: ai-risk-taxonomy-ip-rights/-trade-secrets
  name: IP Rights/ Trade Secrets
  evidence:
  - text: Don't put confidential or commercially sensitive data in an AI tool that
      is external to LSE. Aside from breaching confidentiality simply by feeding it
      to the AI, it is also likely that the data can be regurgitated, that is disclosed
      to an indefinite number of third parties outside your or LSE's control.
    section: What not to do
  - text: Inputting copyrighted content owned by someone else into an AI tool could
      potentially infringe their copyright, depending on how much of such content
      is input, the applicability of any legal/contractual exception and how the content
      is transformed or utilised by the AI system.
    section: Copyright AI Issues
  - text: Inputting copyrighted content owned by someone else into an AI tool could
      potentially infringe their copyright, depending on how much of such content
      is input, the applicability of any legal/contractual exception and how the content
      is transformed or utilised by the AI system.
    section: Copyright AI Issues
- id: ai-risk-taxonomy-malware
  name: Malware
  evidence:
  - text: Never ask an AI to perform tasks that are malicious or that may compromise
      other people or data that is not yours. This at a minimum would constitute a
      breach of the Computer Misuse Act 1990
    section: Cybersecurity AI rules
  - text: Never ask an AI to perform tasks that are malicious or that may compromise
      other people or data that is not yours.
    section: Cybersecurity AI rules
  - text: Don't ask an AI tool to do something malicious or illegal.
    section: What not to do
- id: ai-risk-taxonomy-plagiarism
  name: Plagiarism
  evidence:
  - text: Don't upload in-copyright content (for example , images, photographs, student
      work, journal articles licensed from publishers by LSE library) where you do
      not have the copyright holder's permission and where the AI tool is known to
      use inputs as training data.
    section: What not to do
  - text: Don't upload in-copyright content (for example , images, photographs, student
      work, journal articles licensed from publishers by LSE library) where you do
      not have the copyright holder's permission
    section: What not to do
  - text: If the output reproduces a substantial part of a third-party copyright work
      because the system was trained on that work, then potentially there may be an
      infringement.
    section: Copyright AI Issues
