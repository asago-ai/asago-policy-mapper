risks:
- id: ai-risk-taxonomy-adversely-affects-legal-rights
  name: Adversely affects legal rights
  evidence:
  - text: Where we are using AI in a way that produces legal effects, data subjects
      need to know about this and have the right to request human review e.g. if an
      AI is used for marking, students need to be told their data will be processed
      this way and have the right to appeal for a human review.
    section: Data Protection AI issues
  - text: data subjects 'have the right not to be subject to a decision based solely
      on automated processing, including profiling, which produces legal effects concerning
      him or her or similarly significantly affects him or her'.
    section: Data Protection AI issues
  - text: Any automated decisions that have real-world impacts on humans must allow
      for a human review.
    section: Cybersecurity AI rules
- id: ai-risk-taxonomy-anticompetitive-practices
  name: Anticompetitive practices
  evidence:
  - text: The School cannot use public AI systems for processing tenders as this could
      make the commercially sensitive pricing data available to third parties including
      their competitors.
    section: Competition and confidentiality AI issues
  - text: Any information which could potentially be considered breaching competition
      law should also not be put in a public AI system as this could be regurgitated.
    section: Competition and confidentiality AI issues
  - text: 'That the School does not share data or discuss any of the following with
      potential competitors: Future pricing intentions e.g. course fees, Student numbers'
    section: Competition law requirements
