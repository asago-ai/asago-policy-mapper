  name: Economic and cultural devaluation of human effort
  evidence:
  - text: Generative AI - creates synthetic content that mimics human creativity.
    section: What is AI - definitions
    page: 3
- id: mit-ai-risk-subdomain-6.5
  name: Governance failure
  evidence:
  - text: The CDPA was drafted before the possibilities and challenges of GenAI were
      known. Law, and the governments that make it, are lagging behind developments
      in this area. There is, therefore, considerable uncertainty around who is the
      owner of the copyright in an AI generated work and what actions should, or should
      not, be considered copyright infringement when it comes to the use of AI systems.
    section: Copyright and AI
  - text: There are currently a number of legal cases in progress challenging the
      legality of the use of copyright works to train GenAI (LLMs and images) without
      copyright holder permission.
    section: Copyright and AI
  - text: Law, and the governments that make it, are lagging behind developments in
      this area.
    section: Copyright and AI
- id: mit-ai-risk-subdomain-7.3
  name: Lack of capability or robustness
  evidence:
  - text: AI tools are known to hallucinate, namely supplying information that has
      no basis in reality, or else reproducing information that is out of date or
      is misinformation.
    section: Cybersecurity AI rules
- id: mit-ai-risk-subdomain-7.4
  name: Lack of transparency or interpretability
  evidence:
  - text: 'b) Issues of transparency: Consider whether there is transparent enough
      use of AI tools. Where processes and decisions affect people and their personal
      data, they should be made aware of how the AI is being used and how their data
      is being processed.'
    section: Bias and discrimination AI issues
  - text: 'c) Explainability: Where the output of an AI tool has influenced decision
      making or where an AI automated process is used, there should be someone appropriately
      trained and/ or informed to provide an explanation for how the AI tool has been
      used.'
    section: Bias and discrimination AI issues
