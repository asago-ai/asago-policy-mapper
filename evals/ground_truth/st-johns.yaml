risks:
- id: ai-risk-taxonomy-discrimination-in-employment,-benefits,-or-services
  name: Discrimination in employment, benefits, or services
  evidence:
  - text: The University commits to the ethical use of AI in accordance with its professional
      conduct and non-discrimination policies. These technologies must not be used
      to create content that is inappropriate, discriminatory, deceptive, or otherwise
      harmful to others or to the University.
    section: Policy
  - text: Biases are inherent in AI, especially when using Generative AI tools. Information
      should be carefully reviewed for these biases (both unconscious and conscious),
      as well as validation of answers.
    section: Policy
  - text: AI users are responsible for ensuring that the AI-generated content aligns
      with the University’s mission and values, and should actively work to identify
      and mitigate biases in AI systems.
    section: Policy
- id: ai-risk-taxonomy-generating-or-promoting-misinformation
  name: Generating or promoting misinformation
  evidence:
  - text: Inaccurate and biased information in AI and their impact on decision-making
      – Biases are inherent in AI, especially when using Generative AI tools. Information
      should be carefully reviewed for these biases (both unconscious and conscious),
      as well as validation of answers. Fact-checking information is necessary before
      answers are considered absolute and used in any decision-making capacity.
    section: Policy
  - text: All AI-generated content must be carefully reviewed for accuracy, appropriateness,
      and bias before relying on it for work purposes.
    section: Policy
  - text: All AI-generated content must be carefully reviewed for accuracy, appropriateness,
      and bias before relying on it for work purposes.
    section: Policy
- id: ai-risk-taxonomy-ip-rights/-trade-secrets
  name: IP Rights/ Trade Secrets
  evidence:
  - text: AI users are prohibited from inputting data specific to St. John’s University,
      including confidential or proprietary business information belonging to the
      University when using commercially, publicly available AI tools.
    section: Policy
- id: ai-risk-taxonomy-not-labeling-content-as-ai-generated
  name: Not labeling content as AI-generated (Using chatbots to convince people they
    are communicating with a human)
  evidence:
  - text: AI use in work should always be disclosed, and AI users must not plagiarize
      or fail to attribute AI-generated content that is used for work purposes.
    section: Policy
