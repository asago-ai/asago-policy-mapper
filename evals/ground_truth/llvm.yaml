- id: credo-risk-043
  name: Economic and cultural devaluation of human effort
  evidence:
  - text: Sending the unreviewed output of an LLM to open source project maintainers
      *extracts* work from them in the form of design and code review, so we call
      this kind of contribution an "extractive contribution".
    section: Extractive Contributions
  - text: Sending the unreviewed output of an LLM to open source project maintainers
      *extracts* work from them in the form of design and code review, so we call
      this kind of contribution an "extractive contribution".
    section: Extractive Contributions
  - text: While new tools enable more development, it shifts effort from the implementor
      to the reviewer, and our policy exists to ensure that we value and do not squander
      maintainer time.
    section: Extractive Contributions
