risks:
- id: ai-risk-taxonomy-ip-rights/-trade-secrets
  name: IP Rights/ Trade Secrets
  evidence:
  - text: Using AI tools to regenerate copyrighted material does not remove the copyright,
      and contributors are responsible for ensuring that such material does not appear
      in their contributions.
    section: Copyright
  - text: Using AI tools to regenerate copyrighted material does not remove the copyright,
      and contributors are responsible for ensuring that such material does not appear
      in their contributions.
    section: Copyright
  - text: Artificial intelligence systems raise many questions around copyright that
      have yet to be answered.
    section: Copyright
- id: ai-risk-taxonomy-not-labeling-content-as-ai-generated
  name: Not labeling content as AI-generated (Using chatbots to convince people they
    are communicating with a human)
  evidence:
  - text: 'Contributors should note tool usage in their pull request description,
      commit message, or wherever authorship is normally indicated for the work. For
      instance, use a commit message trailer like Assisted-by: .'
    section: Policy
  - text: Contributors should note tool usage in their pull request description, commit
      message, or wherever authorship is normally indicated for the work.
    section: Policy
  - text: Contributors are expected to be transparent and label contributions that
      contain substantial amounts of tool-generated content .
    section: Policy
- id: ai-risk-taxonomy-other-unauthorized-actions-on-behalf-of-users
  name: Other unauthorized actions on behalf of users
  evidence:
  - text: An important implication of this policy is that it bans agents that take
      action in our digital spaces without human approval, such as the GitHub [`@claude`](https://github.com/claude/)
      [agent](https://github.com/claude/) .
    section: Details
  - text: An important implication of this policy is that it bans agents that take
      action in our digital spaces without human approval, such as the GitHub @claude
      agent .
    section: Details
  - text: Similarly, automated review tools that publish comments without human review
      are not allowed.
    section: Details
