risks:
- id: ai-risk-taxonomy-unauthorized-disclosure
  name: Unauthorized disclosure
  evidence:
  - text: Supplier is not permitted to Process Protected Data for training, retraining
      or improving Artificial Intelligence or Machine Learning technologies without
      Cisco's express written permission.
    section: 1. Use of Protected Data for Artificial Intelligence and Machine Learning.
  - text: '''Process'' and any other form of the verb ''Process'' means any operation
      or set of operations that is performed upon Protected Data, whether or not by
      automatic means, such as collection, recording, securing, organization, storage,
      adaptation or alteration, access to, retrieval, consultation, use, disclosure
      by transmission, dissemination or otherwise making available, alignment or combination,
      blocking, erasure, or destruction.'
    section: 3. Definitions
