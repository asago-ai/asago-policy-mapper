- id: credo-risk-025
  name: Corporate liability
  evidence:
  - text: If Supplier seeks permission according to the above section 1.1., Cisco
      reserves the right to audit Supplier's AI/ML governance program before deciding
      whether to grant the requested permission and on a regular basis (with a notice
      period of 14 days) after a permission has been granted.
    section: 2. Supplier's Use of Artificial Intelligence and Machine Learning.
  - text: If Supplier is using or intends to use Artificial Intelligence and/or Machine
      Learning technologies in the course of Performing, it is required to have an
      AI/ML governance program in place, with defined policies and procedures, that
      meets or exceeds current best industry standards.
    section: 2. Supplier's Use of Artificial Intelligence and Machine Learning.
