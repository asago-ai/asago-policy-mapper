- id: atlas-unreliable-source-attribution
  name: Unreliable source attribution
  evidence:
  - text: When we attribute a statement, a position, or a quote to a named source,
      that material comes from direct engagement with interviews, transcripts, published
      statements, or documents reviewed by the reporter. AI tools must not be used
      to generate, extract, or summarize material that is then attributed to a named
      source, whether as a direct quote, a paraphrase, or a characterization of someone’s
      views.
    section: Research and source material
  - text: AI tools must not be used to generate, extract, or summarize material that
