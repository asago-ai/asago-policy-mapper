    section: Research and source material
- id: atlas-impact-on-human-agency
  name: AI agents' Impact on human agency
  evidence:
  - text: AI would not become the author, the illustrator, or the videographer. These
      tools are best used by professionals in the service of their profession, not
      as a clever end run around it, and certainly not as a path to eventually replacing
      it.
    section: Our newsroom AI policy
  - text: We do not publish AI-generated images, audio, or video as authentic documentation
      of real events. We do not alter documentary media in ways that change their
      meaning.
    section: Images, audio, and video
  - text: Where we use AI tools in our workflow, we use them with standards and oversight,
      and humans make every editorial decision.
    section: Our newsroom AI policy
