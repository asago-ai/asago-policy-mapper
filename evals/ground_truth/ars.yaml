risks:
- id: ai-risk-taxonomy-generating-or-promoting-misinformation
  name: Generating or promoting misinformation
  evidence:
  - text: We don’t publish claims based solely on AI-generated summaries, and reporters
      may not represent any material as “reviewed” unless they have examined it directly.
    section: Research and source material
  - text: We don’t publish claims based solely on AI-generated summaries, and reporters
      may not represent any material as “reviewed” unless they have examined it directly.
    section: Research and source material
  - text: Anyone who uses AI tools in our editorial workflow is responsible for the
      accuracy and integrity of the resulting work.
    section: Accountability is non-negotiable
- id: ai-risk-taxonomy-impersonating-humans
  name: Impersonating humans
  evidence:
  - text: AI tools must not be used to generate, extract, or summarize material that
      is then attributed to a named source, whether as a direct quote, a paraphrase,
      or a characterization of someone’s views.
    section: Research and source material
  - text: Ars Technica is written by humans. AI doesn’t write our stories, generate
      our images, or put words in anyone’s mouth.
    section: Ars Technica’s policy on generative AI
  - text: Ars Technica is written by humans. Our reporting, analysis, and commentary
      are human-authored.
    section: Our journalism is human-authored
- id: ai-risk-taxonomy-not-labeling-content-as-ai-generated
  name: Not labeling content as AI-generated (Using chatbots to convince people they
    are communicating with a human)
  evidence:
  - text: When synthetic media is used in the context of reporting on AI, it will
      be clearly identified as AI-generated, with that disclosure placed as close
      to the material as possible.
    section: Images, audio, and video
  - text: When synthetic media is used in the context of reporting on AI, it will
      be clearly identified as AI-generated, with that disclosure placed as close
      to the material as possible.
    section: Images, audio, and video
  - text: In those cases, AI-generated material is presented as exemplar material
      and is set apart visually, with disclosure placed as close to the material as
      possible.
    section: Our journalism is human-authored
