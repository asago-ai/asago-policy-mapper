risks:
- id: ai-risk-taxonomy-adversely-affects-legal-rights
  name: Adversely affects legal rights
  evidence:
  - text: Ensure that enterprise Generative AI tools are not used to make decisions,
      undertake assessments, or for other administrative functions that may have consequences
      for individuals or cause them significant harm.
    section: OVIC’s minimum expectations
  - text: This is especially important where the outputs of an enterprise Generative
      AI tool are used to inform decision making about an individual, such as whether
      they are eligible for a service or a payment.
    section: Privacy policies
  - text: It risks unfair decisions being made about them based on information created
      by Generative AI, that may be inaccurate or of a diminished quality.
    section: OVIC’s minimum expectations
