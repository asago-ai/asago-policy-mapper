- id: credo-risk-046
  name: Governance failures
  evidence:
  - text: The December 2025 update to the policy strengthens government's approach
      to safe and responsible AI through new measures on AI governance. It introduces
      requirements for agencies to develop a strategic approach to adopting AI, establish
      an approach to operationalise the responsible use of AI, ensure designated accountability
      for AI use cases, and undertake risk-based use case-level actions.
    section: Policy introduction
  - text: It introduces requirements for agencies to develop a strategic approach
      to adopting AI, establish an approach to operationalise the responsible use
      of AI, ensure designated accountability for AI use cases, and undertake risk-based
      use case-level actions.
    section: Policy introduction
  - text: In recognition of the speed and scale of change in this area, the policy
      will evolve over time as the technology changes, leading practices emerge, the
      broader regulatory environment develops, and government's AI maturity improves.
    section: Policy introduction
