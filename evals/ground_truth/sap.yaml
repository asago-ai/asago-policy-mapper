- id: ai-risk-taxonomy-unauthorized-processing---pii-(personal-identifiable-information)
  name: Unauthorized processing - PII (Personal Identifiable Information)
  evidence:
  - text: Implement safeguards to protect personal data used to train AI models.
    section: The AI Ethics Policy
  - text: In alignment and compliance with applicable data protection, and privacy
      laws, products that use AI systems in the processing of personal data must provide
      transparency to the extent possible as to how the AI system was used in clear
      and simple language if requested by the data subject.
    section: 03 Realization
