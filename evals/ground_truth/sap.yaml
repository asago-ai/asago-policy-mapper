- id: atlas-data-bias
  name: Data bias
  evidence:
  - text: Where relevant, the data used to train AI systems shall be as inclusive
      as possible, representing as diverse a cross-section of the population or past
      situations as possible, and as free as possible from (or accounted and mitigated
      for) any historic or socially constructed biases, inaccuracies, errors, and
      mistakes.
    section: Addressing Bias & Discrimination
  - text: Where relevant, the data used to train AI systems shall be as inclusive
      as possible, representing as diverse a cross-section of the population or past
      situations as possible, and as free as possible from (or accounted and mitigated
      for) any historic or socially constructed biases, inaccuracies, errors, and
      mistakes.
    section: 02. Validation
- id: atlas-data-privacy-rights
  name: Data privacy rights alignment
  evidence:
  - text: In alignment and compliance with applicable data protection, and privacy
      laws, products that use AI systems in the processing of personal data must provide
