      Healthcare, Private services and Public services and benefits, Law Enforcement,
      Migration, Democratic processes?'
    section: Determining High Risk Cases
  - text: 'Does the use case belong to one of the following domains: E.g. Categorisation
      of natural persons, Management and operation of critical infrastructure, Employment/HR,
      Healthcare, Private services and Public services and benefits, Law Enforcement,
      Migration, Democratic processes?'
    section: SAP High Risk Cases
  - text: High-risk use cases are not prohibited within SAP; however, they must first
      go through an assessment process of the AI Ethics Steering Committee before
      they can be further developed, deployed, and sold.
    section: SAP High Risk Cases
