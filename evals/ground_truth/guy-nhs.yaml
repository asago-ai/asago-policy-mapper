risks:
- id: ai-risk-taxonomy-control-override-(safety/privacy-filters)
  name: Control override (safety/privacy filters)
  evidence:
  - text: AI tooling must never be used to circumvent security controls at the Trust.
      (For example hacking devices, jailbreak, eavesdropping, etc).
    section: 5.5 Information Security
  - text: Don't install or use a solution that would circumvent Trust policies and
      standards.
    section: 8 Do's and Don'ts
- id: ai-risk-taxonomy-generating-or-promoting-misinformation
  name: Generating or promoting misinformation
  evidence:
  - text: LLMs are trained on massive datasets of text and code, and are still under
      development. They can sometimes generate incorrect or misleading information
      that can appear correct.
    section: 5.4 Information Governance and Resilience
  - text: Be aware that LLMs are trained on massive datasets of text and code, are
      still under development, and they can sometimes generate incorrect or misleading
      information.
    section: 8 Do's and Don'ts
  - text: They can sometimes generate incorrect or misleading information that can
      appear correct.
    section: 5.4.6 Regarding Large Language Models (LLMs)
- id: ai-risk-taxonomy-ip-rights/-trade-secrets
  name: IP Rights/ Trade Secrets
  evidence:
  - text: 'Under no circumstances should personal identifiable or business sensitive
      information be entered into a Large Language Model (LLM) or publicly available
      Artificial Intelligence (AI) solution. This includes but is not limited to:
      Sensitive information; Patient Information; Staff Information; Intellectual
      Property; Proprietary Code or proprietary information; Passwords; Keys; credit
      card numbers or other financial information.'
    section: 8 Do's and Don'ts
  - text: All development and procurement must take into account data privacy; consent
      (&amp; opt out), surveillance concerns  [eg.RIPA] data sharing, intellectual
      property; equality of use; copyright law; FOI; etc.
    section: 5.4.2 Regulatory compliance
  - text: All development and procurement must take into account data privacy; consent
      (&amp; opt out), surveillance concerns [eg.RIPA] data sharing, intellectual
      property; equality of use; copyright law; FOI; etc.
    section: 5.4.2 Regulatory compliance
- id: ai-risk-taxonomy-malware
  name: Malware
  evidence:
  - text: For example, AI can be used by cybercriminals to generate phishing emails,
      malicious code, QR codes, deepfake video / audio, malware, internet scraping,
      to obtain credentials for hacking accounts, exfiltrating sensitive Trust data
      (e.g. personal, patient or financial information), or to evade detection.
    section: 3 Policy Objectives
  - text: AI can be used by cybercriminals to generate phishing emails, malicious
      code, QR codes, deepfake video / audio, malware, internet scraping, to obtain
      credentials for hacking accounts, exfiltrating sensitive Trust data (e.g. personal,
      patient or financial information), or to evade detection.
    section: '3.1 This policy is intended to:'
  - text: Monitoring for AI specific attacks (e.g. generate phishing emails; malicious
      code; QR Codes; Deepfakes; malware; scrape internet; to obtain credentials,
      personal Data or financial information; or evade detection) will be carried
      out.
    section: 5.3 Operation and Monitoring
- id: ai-risk-taxonomy-medical/pharmaceutical
  name: Medical/Pharmaceutical
  evidence:
  - text: LLMs should not be used to make medical diagnoses or to provide medical
      advice if not approved for use as medical device.
    section: 5.4 Information Governance and Resilience
  - text: AI as a medical device (e.g. where the AI has some functionally diagnostic
      output that has a dosing implication).
    section: 1 Scope
