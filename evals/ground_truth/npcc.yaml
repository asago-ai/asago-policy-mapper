      use is fair and lawful, balancing ethics, right to privacy, unbiased treatment
      and consent, with the absolute right to a fair trial.
    section: 3 Governance of AI and the AI Principles
  - text: Critically, the fear of unintended consequences and impingement of civil
      liberties, deservedly or not, is associated with p olicing's use of AI.
    section: 1.2 Policing 's Use of Artificial Intelligence
  - text: they ensure use is fair and lawful, balancing ethics, right to privacy,
      unbiased treatment and consent, with the absolute right to a fair trial.
    section: 3 Governance of AI and the AI Principles
