- id: ai-risk-taxonomy-adversely-affects-legal-rights
  name: Adversely affects legal rights
  evidence:
  - text: assessments or decisions about individuals including in law enforcement,
      housing, hiring and employment, financial, educational, or healthcare contexts,
      decisions regarding access to or eligibility for government benefits or about
      child welfare, or the functioning of emergency services or critical infrastructure.
    section: 4.1 Use of AI
- id: ai-risk-taxonomy-discrimination-in-employment,-benefits,-or-services
  name: Discrimination in employment, benefits, or services
  evidence:
  - text: Use of AI systems must be fair and equitable in accordance with applicable
      State and Federal laws, rules, and regulations. SE must be aware that systemic,
      computational, and human biases may impact AI systems and should develop a plan
      to monitor for such biases, and, where identified, remediated identified biases.
    section: 4.3 Fairness and Equity
  - text: Examples of such activities include but are not limited to assessments or
      decisions about individuals including in law enforcement, housing, hiring and
      employment, financial, educational, or healthcare contexts, decisions regarding
      access to or eligibility for government benefits or about child welfare, or
      the functioning of emergency services or critical infrastructure.
    section: 3.2 Definitions and Covered Use
