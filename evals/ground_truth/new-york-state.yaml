- id: mit-ai-risk-subdomain-7.4
  name: Lack of transparency or interpretability
  evidence:
  - text: Transparency is an important principle of AI governance. Where members of
      the public interact directly with SE systems that use AI technology, the use
      of such AI technology should be disclosed by the SE. Furthermore, SE users of
      AI systems must provide meaningful oversight over all decisions made by an AI
      system and be able to explain the decision or output.
    section: 4.4 Transparency
