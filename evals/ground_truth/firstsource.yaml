- id: ai-risk-taxonomy-ip-rights/-trade-secrets
  name: IP Rights/ Trade Secrets
  evidence:
  - text: 'Intellectual Property and AI Policy : Employees must understand that any
      content created using AI tools may be subject to intellectual property rights
      and must comply with company guidelines regarding ownership and attribution.'
    section: 5. Ethical use of AI (Do's)
  - text: Employees must understand that any content created using AI tools may be
