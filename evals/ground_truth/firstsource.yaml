risks:
- id: ai-risk-taxonomy-adversely-affects-legal-rights
  name: Adversely affects legal rights
  evidence:
  - text: Do not use GenAI tools to make or help you make employment decisions about
      applicants or employees, including recruitment, hiring, retention, promotions,
      transfers, performance monitoring, discipline, demotion, or terminations.
- id: ai-risk-taxonomy-content-abetting/involving/furthering-activities-violating-any-applicable-law
  name: Content abetting/involving/furthering activities violating any applicable
    law
  evidence:
  - text: Employees must not use AI programs to create or disseminate malicious software
      or engage in hacking or other unauthorized activities.
    section: Don'ts
  - text: Employees must not use AI programs to engage in activities that could damage
      the reputation of the company or violate the Privacy rights of others.
    section: Don'ts
  - text: Employees should not use, implement or develop any AI tool that is prohibited
      by regulation/law.
    section: 7. Prohibited AI Tools
- id: ai-risk-taxonomy-employment
  name: Employment
  evidence:
  - text: Do not use GenAI tools to make or help you make employment decisions about
      applicants or employees, including recruitment, hiring, retention, promotions,
      transfers, performance monitoring, discipline, demotion, or terminations.
    section: 8.3 Additional Restrictions
  - text: Do not use GenAI tools to make or help you make employment decisions about
      applicants or employees, including recruitment, hiring, retention, promotions,
      transfers, performance monitoring, discipline, demotion, or terminations.
    section: 8.3 Additional Restrictions
- id: ai-risk-taxonomy-generating-or-promoting-misinformation
  name: Generating or promoting misinformation
  evidence:
  - text: AI-generated content should be reviewed by a human to ensure it's appropriate
      for its intended purpose, it adheres to Company's inclusion principles, does
      not promote bias, does not infringe on any internal or external intellectual
      property rights, that the content generated is accurate, and that the output
      does not present false or misleading information (e.g. hallucinations).
    section: 8.1 Guidelines
  - text: Prohibit the use of AI tools that do not comply with data protection regulations,
      promoting mis information, inadequate security, tools with proprietary risks,
      or that do not guarantee the confidentiality of input data.
    section: 7. Prohibited AI Tools
  - text: Don't Use AI to Spread Misinformation or Disinformation
    section: Don'ts
- id: ai-risk-taxonomy-impersonating-humans
  name: Impersonating humans
  evidence:
  - text: If you are using an AI tool to replicate someone's image, likeness, or voice
      - you need to get their express written permission first.
    section: 8.4 AI-Generated Output Guardrails
- id: ai-risk-taxonomy-impersonating-others
  name: Impersonating others
  evidence:
  - text: If you are using an AI tool to replicate someone's image, likeness, or voice
