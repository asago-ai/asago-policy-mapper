- id: ai-risk-taxonomy-not-labeling-content-as-ai-generated
  name: Not labeling content as AI-generated (Using chatbots to convince people they
    are communicating with a human)
  evidence:
  - text: 'GenAI Consumer /User Disclosure : You are interacting with generative AI
      (and not a human). Content is generative AI generated. GenAI disclosure must
      be prominent by following below ''Artificial Intelligence Disclosure (AID) Framework
      of 2012''.'
    section: 13. Developer and Deployer Obligations
  - text: 'AI Only Responses : If an AI feature shall directly present a response
      to customers or third parties without human review or intervention, you must
      disclose to the customer that they are: Engaging solely with an AI.'
    section: 8.4 AI-Generated Output Guardrails
  - text: 'Transparency: Transparency implies openness, communication, and accountability.
      This means that where we use AI, we should disclose to the users that they are
      interacting with whole AI model/system/tool or in part.'
    section: 5. Ethical use of AI
