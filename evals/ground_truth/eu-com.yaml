- id: ai-risk-taxonomy-ip-rights/-trade-secrets
  name: IP Rights/ Trade Secrets
  evidence:
  - text: Lack of transparency on the origin of materials used for training generative
      AI models raises concerns related to intellectual property (IP) rights, regardless
      of whether the tool is internal or external. It is possible that copyright protected
      information has been used for training the AI model and ends up being reproduced
      in the output.
    section: 2.4. [Rule n°4] Be mindful of potential intellectual property rights
      violations and avoid directly replicating the output of a generative AI tool
      in public documents.
  - text: It is possible that copyright protected information has been used for training
