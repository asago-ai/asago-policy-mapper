- id: ai-risk-taxonomy-generating-or-promoting-misinformation
  name: Generating or promoting misinformation
  evidence:
  - text: AI Models, Including LLM's, can sometimes 'hallucinate'-this means they
      may generate information that sounds plausible but is actually incorrect, made
      up, or not supported by real data.
    section: 5.3 What should I consider when using AI?
  - text: AI tools can produce inaccurate, misleading, or fabricated information-commonly
      referred to as "hallucinations." This includes misrepresentation of facts, sources,
      or context.
    section: 5.5 Key Risks of Using AI in Policing
  - text: AI is not $100 % $ reliable and you must always read and verify anything
      produced.
    section: 5.3 What should I consider when using AI?
