- id: ai-risk-taxonomy-criminal-justice/predictive-policing
  name: Criminal justice/Predictive policing
  evidence:
  - text: AI may also refer more loosely to systems capable of performing repetitive
      tasks without human guidance. An example of this type of AI would be a system
      that analyses CCTV footage, to determine if it contains illegal activities such
      as child sexual abuse, without the need for human intervention to review the
      footage.
    section: 3. What is Artificial Intelligence?
  - text: An example of ADA is a hotspot in policing tool which identifies areas with
      higher likelihood of crime based on environmental factors, guiding where officers
      should be deployed.
    section: 3. What is Artificial Intelligence?
  - text: This includes tasks such as image analysis to detect illegal content or
      predictive modelling for operational planning.
    section: 3. What is Artificial Intelligence?
