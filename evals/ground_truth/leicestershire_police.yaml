risks:
- id: ai-risk-taxonomy-adversely-affects-legal-rights
  name: Adversely affects legal rights
  evidence:
  - text: The use of AI technologies is not yet authorised for use in the Criminal
      Justice process, including for the creation of evidential materials. This means
      it must not be used in the preparation of witness statements, MG forms, or any
      other court ready evidential reports.
    section: 5.4 Al use in the Criminal Justice System
  - text: AI must not be allowed to make operational decisions without human review.
      AI can be used as a tool, to present options and wider considerations. However,
      the responsibility and liability remain with the police decision maker.
    section: 5.3 What should I consider when using AI?
  - text: AI must not be allowed to make operational decisions without human review.
    section: 5.3 What should I consider when using AI?
- id: ai-risk-taxonomy-characterization-of-identity
  name: Characterization of identity
  evidence:
  - text: Be alert to potential bias, stereotyping, or inappropriate content in Copilot
      outputs.
    section: 5.3 What should I consider when using AI?
  - text: AI systems may reflect or amplify societal biases present in their training
      data. This can result in unintended reinforcement of stereotypes related to
      gender, race, profession, or other protected characteristics.
    section: 5.5 Key Risks of Using AI in Policing
