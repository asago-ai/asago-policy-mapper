- id: ai-risk-taxonomy-unauthorized-disclosure
  name: Unauthorized disclosure
  evidence:
  - text: No policing data should ever be put into AI on a personal device or account.
      Only AI authorised by this policy can be used, when logged in using your police
      account on a work device. For example, using a personal mobile phone with an
      AI-powered transcription app to record and transcribe a meeting, interview,
      or operational briefing is strictly prohibited. Such actions risk unauthorised
      data exposure and breach of Force policy.
    section: 5.3 What should I consider when using AI?
  - text: However, due to the nature of policing and the critical importance of safeguarding
      sensitive operations, the following types of information must never be entered,
      pasted, uploaded, or otherwise submitted into Microsoft's Co-pilot or any other
      AI tool-regardless of the device or platform
    section: 5.2 Prohibited Information Types
  - text: Sensitive Operational Policing Data. Avoid inputting highly sensitive operational
      details, such as specific tactics in active use, uncorroborated intelligence,
      or detailed profiles of ongoing covert operations.
    section: 5.2 Prohibited Information Types
