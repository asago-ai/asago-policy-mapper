- id: atlas-impact-human-agency-agentic
  name: AI agents' impact on human agency
  evidence:
  - text: AI tools may assist with aspects of the marking process, but cannot replace
      human academic judgment in determining marks, conducting moderation, or making
      final assessment decisions-these responsibilities remain entirely the responsibility
      of academic staff.
    section: 3. Principles of AI-assisted Marking and Feedback, and Moderation at
      LSE
  - text: Human oversight is always present - staff conduct primary reading and assessment;
      AI assists, it does not decide or replace human agency.
    section: Executive Summary
  - text: 'AI-assisted marking and feedback : Human educators use AI tools to support
      and enhance their work, with full human oversight and final decision-making
      at every stage'
    section: 1. Introduction
  - text: Educators should conduct the primary reading and assessment of student work,
      except in specific circumstances
    section: 3. Principles of AI-assisted Marking and Feedback, and Moderation at
      LSE
- id: atlas-impact-on-affected-communities
  name: Impact on affected communities
  evidence:
  - text: Staff should critically reflect on how AI-assisted practices affect student
      perceptions of authenticity, trust, and fairness. Staff are encouraged to seek
      student feedback on these practices.
    section: Guidelines for Implementation
  - text: Students question the authenticity of AI-generated comments, finding them
      impersonal and ethically inconsistent, especially when their own GenAI use may
      be discouraged.
    section: Research Context and Rationale
  - text: Without proper guidance, integrating GenAI into educational practices could
      undermine the integrity and quality of education we provide.
    section: Why Guidance is Needed
