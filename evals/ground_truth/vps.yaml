risks:
- id: ai-risk-taxonomy-adversely-affects-legal-rights
  name: Adversely affects legal rights
  evidence:
  - text: Government decisions are open to scrutiny including through formal merit
      and judicial reviews processes. Generative AI tools provide no, or limited,
      explanation on how materials are created. Relying on materials created by these
      tools without being able to explain their conclusions may be unfair and may
      lead to decisions not being upheld.
    section: Maintain accountability, transparency and explainability
  - text: Use these tools to make decisions, undertake assessments or use them for
      other administrative actions that may have consequences for individuals, groups
      or organisations.
    section: When using Generative AI tools
  - text: Relying on materials created by these tools without being able to explain
      their conclusions may be unfair and may lead to decisions not being upheld.
    section: When using Generative AI tools
