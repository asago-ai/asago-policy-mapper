name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8 ( longer publishes major/minor tags — SHA pinning is the only supported approach)
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff format --check src/ tests/
      - run: uv run ruff check src/ tests/
      - run: uv run mypy src/asago_policy_mapper/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8 ( longer publishes major/minor tags — SHA pinning is the only supported approach)
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest tests/ -rs -m "not slow"

  test-slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8 ( longer publishes major/minor tags — SHA pinning is the only supported approach)
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest tests/ -rs -m slow

  test-llm-ollama:
    runs-on: ubuntu-latest
    concurrency:
      group: test-llm-ollama-${{ github.ref }}
      cancel-in-progress: true
    env:
      OLLAMA_MODELS: /home/runner/.ollama-models
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Install Ollama
        # Pin install script to a Git blob SHA (immutable) instead of piping the live URL.
        # To update: find the commit for the new release tag with
        #   gh api repos/ollama/ollama/git/ref/tags/<TAG> --jq '.object.sha'
        run: curl -fsSL https://raw.githubusercontent.com/ollama/ollama/710292ff4f191d8da9f6a4230804fbc693338d4a/scripts/install.sh | OLLAMA_VERSION=0.31.1 sh
      - name: Restore Ollama model cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-gemma3-1b
      - name: Start Ollama and pull model
        run: |
          sudo systemctl stop ollama 2>/dev/null || true
          ollama serve &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull gemma3:1b
      - name: Run LLM integration tests
        env:
          LLM_BASE_URL: "http://localhost:11434/v1"
          LLM_MODEL: "gemma3:1b"
        run: uv run pytest tests/ -rs --test-llm -m llm -v -s --tb=short -W ignore::DeprecationWarning
      - name: Save Ollama model cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-gemma3-1b
