<button class="dark-toggle" id="rl-dark-toggle" onclick="document.documentElement.classList.toggle('dark');var d=document.documentElement.classList.contains('dark');localStorage.setItem('rl-dark-mode',d);this.textContent=d?'\u2600\uFE0F':'\uD83C\uDF19'"></button>
<script>document.getElementById('rl-dark-toggle').textContent=document.documentElement.classList.contains('dark')?'\u2600\uFE0F':'\uD83C\uDF19';</script>
