[project]
name = "asago-policy-mapper"
version = "0.1.0"
description = "Policy risk extraction using AI Atlas Nexus risk taxonomy"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "docling>=2.0,<3.0",
    "torch>=2.11,<2.15",
    "transformers>=5.5,<5.20",
    "ai-atlas-nexus==1.2.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "spacy>=3.7",
    "numpy<2.5",
    "mlflow>=3.15.0",
    "aiohttp>=3.14.0",
]

[project.optional-dependencies]
experiments = ["optuna>=4.8.0", "dspy>=2.0"]

[project.scripts]
asago-policy-mapper = "asago_policy_mapper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asago_policy_mapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that load embedding models (~11-14s each)",
    "llm: integration tests requiring a live LLM server (e.g. Ollama)",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "dspy>=2.6",
    "pytest-crap>=0.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "types-PyYAML>=6.0",
    "pytest-timeout>=2.4.0",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "ai_atlas_nexus.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"run_extract_battery.py" = ["E501"]

# Mutation testing (mutmut 3.x). mutmut is NOT a project dependency: install it
# ad hoc into the venv with `UV_NO_CONFIG=1 uv pip install mutmut` so uv.lock
# stays untouched. See "Mutation testing" in CLAUDE.md for the per-PR workflow
# and the sandbox-isolation caveats; tests/test_mutmut_canary.py guards the
# sandbox against silently importing the original tree instead of mutants/.
[tool.mutmut]
source_paths = ["src/asago_policy_mapper/"]
pytest_add_cli_args_test_selection = [
    "-m",
    "not slow and not llm",
    "tests/",
    # dspy-experiment tests import `experiments`, which breaks under the
    # mutants/ sandbox cwd (see CLAUDE.md "Mutation testing").
    "--ignore=tests/test_dspy_embedding_metric.py",
    "--ignore=tests/test_dspy_embedding_dataset.py",
]
